a<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f5f0;
      color: #222;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    header {
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: 0.05em;
    }

    header span {
      font-size: 0.8rem;
      color: #888;
      font-family: 'Courier New', monospace;
    }

    main { padding: 2rem; }

    .gallery {
      columns: 4 220px;
      column-gap: 12px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      background: #e8e8e3;
      cursor: pointer;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: opacity 0.2s ease;
    }

    .gallery-item:hover img { opacity: 0.88; }

    .gallery-item .name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      padding: 4px 7px;
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-item:hover .name { opacity: 1; }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      box-shadow: 0 4px 40px rgba(0,0,0,0.5);
    }

    #lightbox .lb-name {
      color: #aaa;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
    }

    #lightbox .lb-close {
      position: absolute;
      top: 1.25rem; right: 1.5rem;
      background: none; border: none;
      color: #aaa; font-size: 1.5rem;
      cursor: pointer; line-height: 1;
    }

    #lightbox .lb-close:hover { color: #fff; }

    #lb-prev, #lb-next {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: none; border: none;
      color: #888; font-size: 2rem;
      cursor: pointer; padding: 0.5rem 1rem;
      user-select: none;
    }

    #lb-prev:hover, #lb-next:hover { color: #fff; }
    #lb-prev { left: 1rem; }
    #lb-next { right: 1rem; }

    .empty {
      color: #999; font-size: 0.9rem;
      padding: 3rem 0;
      font-family: 'Courier New', monospace;
    }

    @media (max-width: 600px) {
      .gallery { columns: 2 140px; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Fotos</h1>
  <span id="count"></span>
</header>

<main>
  <div class="gallery" id="gallery">
    <p class="empty">Cargando...</p>
  </div>
</main>

<div id="lightbox">
  <button class="lb-close" id="lb-close" title="Cerrar">✕</button>
  <button id="lb-prev">&#8592;</button>
  <img id="lb-img" src="" alt="" />
  <span class="lb-name" id="lb-name"></span>
  <button id="lb-next">&#8594;</button>
</div>

<script>
  async function loadPhotos() {
    const gallery = document.getElementById('gallery');
    const countEl = document.getElementById('count');

    let files = [];

    try {
      const res = await fetch('/photos/manifest.json');
      if (!res.ok) throw new Error('manifest not found');
      files = await res.json();
    } catch(e) {
      gallery.innerHTML = '<p class="empty">No se pudo cargar manifest.json</p>';
      return;
    }

    if (!files.length) {
      gallery.innerHTML = '<p class="empty">No hay fotos en el manifest.</p>';
      return;
    }

    countEl.textContent = files.length + ' ' + (files.length === 1 ? 'foto' : 'fotos');
    gallery.innerHTML = '';

    files.forEach((file, i) => {
      const src = '/photos/' + file;
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = src;
      img.alt = file;
      img.loading = 'lazy';

      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = file;

      item.appendChild(img);
      item.appendChild(label);
      gallery.appendChild(item);

      item.addEventListener('click', () => openLightbox(i, files));
    });
  }

  let currentFiles = [];
  let currentIndex = 0;

  function openLightbox(index, files) {
    currentFiles = files;
    currentIndex = index;
    showLightboxItem();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function showLightboxItem() {
    const file = currentFiles[currentIndex];
    document.getElementById('lb-img').src = '/photos/' + file;
    document.getElementById('lb-name').textContent = file;
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });

  document.getElementById('lb-prev').addEventListener('click', e => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
    showLightboxItem();
  });

  document.getElementById('lb-next').addEventListener('click', e => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentFiles.length;
    showLightboxItem();
  });

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length; showLightboxItem(); }
    if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % currentFiles.length; showLightboxItem(); }
  });

  loadPhotos();
</script>
</body>
</html>
